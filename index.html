<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 让网站适配手机和电脑 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签上的网站名称 -->
    <title>六合资料站</title>
    <!-- 网站简介 -->
    <meta name="description" content="六合资料站，提供资料分类与浏览功能。">
    <style>
        /* 全局设置 */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: "Microsoft YaHei", "PingFang SC",
                         Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333333;
            line-height: 1.6;
        }
        /* 网站顶部 */
        header {
            background-color: #9b1c31;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 30px;
        }
        header p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #f8e8eb;
        }
        /* 导航栏 */
        nav {
            background-color: #ffffff;
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eeeeee;
        }
        nav a {
            display: inline-block;
            margin: 5px 12px;
            color: #9b1c31;
            text-decoration: none;
            font-size: 15px;
        }
        nav a:hover {
            color: #d04a60;
        }
        /* 页面主体 */
        .container {
            width: 92%;
            max-width: 1100px;
            margin: 25px auto;
        }
        /* 欢迎区域 */
        .welcome {
            background-color: white;
            padding: 25px 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .welcome h2 {
            margin-top: 0;
            color: #9b1c31;
        }
        .welcome p {
            color: #666666;
            margin-bottom: 0;
        }
        /* 搜索区域 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #dddddd;
            border-radius: 6px;
            font-size: 15px;
        }
        .search-box button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #9b1c31;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }
        .search-box button:hover {
            background-color: #7d1426;
        }
        /* 分类区域 */
        .section-title {
            font-size: 21px;
            margin: 25px 0 15px;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .category {
            background-color: white;
            border-radius: 8px;
            padding: 20px 10px;
            text-align: center;
            border: 1px solid #eeeeee;
        }
        .category h3 {
            margin: 0 0 8px;
            font-size: 17px;
            color: #9b1c31;
        }
        .category p {
            margin: 0;
            font-size: 13px;
            color: #888888;
        }
        /* 资料展示区域 */
        .materials {
            background-color: white;
            min-height: 180px;
            padding: 25px 15px;
            border-radius: 8px;
            border: 1px solid #eeeeee;
            text-align: center;
        }
        .empty-message {
            padding: 30px 10px;
            color: #999999;
        }
        /* 页脚 */
        footer {
            margin-top: 40px;
            background-color: #ffffff;
            border-top: 1px solid #eeeeee;
            padding: 20px 15px;
            text-align: center;
            color: #888888;
            font-size: 13px;
        }
        /* 手机屏幕适配 */
        @media (max-width: 600px) {
            header h1 {
                font-size: 25px;
            }
            .categories {
                grid-template-columns: 1fr;
            }
            .search-box button {
                padding: 12px;
            }
            nav a {
                margin: 5px 8px;
            }
        }
    </style>
</head>
<body>
    <!-- 网站顶部 -->
    <header>
        <h1>六合资料站</h1>
        <p>欢迎访问本站，请浏览相关资料栏目</p >
    </header>
    <!-- 导航栏 -->
    <nav>
        <a href=" ">网站首页</a >
        <a href="#categories">资料分类</a >
        <a href="#materials">资料列表</a >
    </nav>
    <!-- 页面主体 -->
    <main class="container">
        <!-- 欢迎区域 -->
        <section class="welcome" id="home">
            <h2>欢迎来到六合资料站</h2>
            <p>
                这里是一个全新的资料展示网站。
                目前尚未添加资料，后续将逐步完善。
            </p >
            <!-- 搜索框 -->
            <form class="search-box" id="searchForm">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="请输入要搜索的资料名称"
                    aria-label="搜索资料名称"
                >
                <button type="submit">搜索</button>
            </form>
            <p id="searchMessage" aria-live="polite"></p >
        </section>
        <!-- 资料分类 -->
        <section id="categories">
            <h2 class="section-title">资料分类</h2>
            <div class="categories">
                <div class="category">
                    <h3>文字资料</h3>
                    <p>暂未添加内容</p >
                </div>
                <div class="category">
                    <h3>图片资料</h3>
                    <p>暂未添加内容</p >
                </div>
                <div class="category">
                    <h3>文件资料</h3>
                    <p>暂未添加内容</p >
                </div>
            </div>
        </section>
        <!-- 资料列表 -->
        <section id="materials">
            <h2 class="section-title">最新资料</h2>
            <div class="materials">
                <div class="empty-message">
                    <p>目前还没有资料。</p >
                    <p>添加资料后，将在这里展示。</p >
                </div>
            </div>
        </section>
    </main>
    <!-- 网站底部 -->
    <footer>
        <p>© <span id="year"></span> 六合资料站</p >
        <p>本站资料仅供信息浏览，请遵守所在地相关法律法规。</p >
    </footer>
    <!-- 简单的页面交互 -->
    <script>
        // 自动显示当前年份
        document.getElementById("year").textContent =
            new Date().getFullYear();
        // 当前没有资料，搜索只显示提示信息
        document.getElementById("searchForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                const keyword = document
                    .getElementById("searchInput")
                    .value.trim();
                const message = document
                    .getElementById("searchMessage");
                if (keyword === "") {
                    message.textContent = "请先输入搜索内容。";
                } else {
                    message.textContent =
                        "目前还没有资料，暂时无法搜索到相关内容。";
                }
            });
    </script>
</body>
</html>
